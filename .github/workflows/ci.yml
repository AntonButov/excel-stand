name: ci

on:
  push:
  pull_request:

jobs:
  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install LibreOffice and poppler
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libreoffice-calc poppler-utils fonts-dejavu-core

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Run tests (corpus gate × 20)
        run: pytest -q --junitxml=pytest-report.xml

      - name: Upload corpus screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corpus-screenshots
          path: out/corpus-screenshots/
          if-no-files-found: ignore
